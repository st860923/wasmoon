name: Testing

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    workflow-policy:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Test publication policy without credentials
              run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24]
                build-mode: [release]
                include:
                    - node-version: 22
                      build-mode: dev
                    - node-version: 24
                      build-mode: pgo-simd

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: recursive
                  persist-credentials: false
            - name: Read pinned Emscripten version
              id: emsdk
              run: echo "version=$(cat .emscripten-version)" >> "$GITHUB_OUTPUT"
            - uses: emscripten-core/setup-emsdk@667eb33f24e84e7f362c16d8d7fff0629a73e15e # v15
              with:
                  version: ${{ steps.emsdk.outputs.version }}
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm run lint:nofix
            - name: Build Wasm
              run: |
                  if [ '${{ matrix.build-mode }}' = dev ]; then
                      npm run build:wasm:dev
                  elif [ '${{ matrix.build-mode }}' = pgo-simd ]; then
                      WASMOON_PGO=generate bash build.sh
                      npm run build
                      profile_dir=$(mktemp -d ./build/profiles.XXXXXX)
                      WASMOON_PROFILE_DIR="$profile_dir" node --import ./bench/collect-profile.js \
                          ./node_modules/mocha/bin/mocha.js --require ./test/boot.js 'test/*.test.js'
                      WASMOON_PROFILE_DIR="$profile_dir" node --import ./bench/collect-profile.js bench/runtime.js
                      "$EMSDK/upstream/bin/llvm-profdata" merge "$profile_dir" -o build/runtime.profdata
                      "$EMSDK/upstream/bin/llvm-profdata" show build/runtime.profdata
                      WASMOON_PGO=use WASMOON_PROFILE=build/runtime.profdata WASMOON_SIMD=1 bash build.sh
                  else
                      npm run build:wasm
                  fi
            - run: npm run build
              id: bundle
            - run: npm test
            - run: npm run luatests
              if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
              env:
                  WASMOON_PGO: ${{ matrix.build-mode == 'pgo-simd' && 'use' || 'off' }}
                  WASMOON_PROFILE: build/runtime.profdata
                  WASMOON_SIMD: ${{ matrix.build-mode == 'pgo-simd' && '1' || '0' }}
            - name: Audit dependencies
              if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
              run: npm audit
            - name: Check package contents
              if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
              run: npm pack --dry-run
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ !cancelled() }}
              with:
                  name: wasmoon-node-${{ matrix.node-version }}-${{ matrix.build-mode }}
                  path: dist/
                  if-no-files-found: ignore
                  retention-days: 7
